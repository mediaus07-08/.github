<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="980" height="620" fill="#ffffff"/>
  <text x="30" y="40" font-size="18" font-weight="700" fill="#1a1a2e">서비스 구성 — AWS EC2 단일 호스트, Docker Compose</text>

  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 사용자 -->
  <rect x="30" y="200" width="170" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="115" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">기자 브라우저</text>
  <text x="115" y="258" text-anchor="middle" font-size="12" fill="#475569">React + TypeScript</text>
  <text x="115" y="274" text-anchor="middle" font-size="12" fill="#475569">(Vite 빌드 SPA)</text>

  <!-- EC2 외곽 -->
  <rect x="280" y="80" width="430" height="470" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="300" y="110" font-size="14" font-weight="700" fill="#334155">AWS EC2 · Docker Compose</text>

  <!-- nginx -->
  <rect x="310" y="140" width="180" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="400" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">nginx :80/443</text>
  <text x="400" y="190" text-anchor="middle" font-size="12" fill="#475569">SPA 정적 서빙 + 프록시</text>
  <text x="400" y="206" text-anchor="middle" font-size="12" fill="#475569">TLS 종단 · /metrics 차단</text>
  <text x="400" y="222" text-anchor="middle" font-size="12" fill="#475569">proxy_read_timeout 300s</text>

  <!-- certbot -->
  <rect x="530" y="140" width="150" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="605" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">certbot</text>
  <text x="605" y="190" text-anchor="middle" font-size="12" fill="#475569">인증서 12시간마다 갱신</text>

  <!-- api -->
  <rect x="310" y="300" width="180" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="400" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">api · FastAPI :8000</text>
  <text x="400" y="350" text-anchor="middle" font-size="12" fill="#475569">도메인 API 5계층</text>
  <text x="400" y="366" text-anchor="middle" font-size="12" fill="#475569">+ 비평 생성 파이프라인</text>
  <text x="400" y="382" text-anchor="middle" font-size="12" fill="#475569">SQLAlchemy 2.0 · scrypt 인증</text>
  <text x="400" y="398" text-anchor="middle" font-size="12" fill="#475569">백그라운드 정기 작업 0개</text>

  <!-- db -->
  <rect x="530" y="300" width="150" height="90" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="605" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">PostgreSQL 15</text>
  <text x="605" y="352" text-anchor="middle" font-size="12" fill="#475569">Alembic 마이그레이션</text>
  <text x="605" y="368" text-anchor="middle" font-size="12" fill="#475569">테이블 13개</text>

  <!-- monitoring -->
  <rect x="310" y="450" width="370" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="495" y="478" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Prometheus · Grafana</text>
  <text x="495" y="500" text-anchor="middle" font-size="12" fill="#475569">127.0.0.1 바인딩 — 외부 미공개, SSH 터널로만 접근</text>

  <!-- 외부 API -->
  <rect x="770" y="150" width="180" height="90" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="860" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">네이버 검색 API</text>
  <text x="860" y="200" text-anchor="middle" font-size="12" fill="#475569">통과 조회 · 무변형 노출</text>
  <text x="860" y="216" text-anchor="middle" font-size="12" fill="#475569">저장·캐시·LLM 투입 없음</text>

  <rect x="770" y="300" width="180" height="90" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="860" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">DeepSeek API</text>
  <text x="860" y="350" text-anchor="middle" font-size="12" fill="#475569">프레이밍·초안·제목 추천</text>
  <text x="860" y="366" text-anchor="middle" font-size="12" fill="#475569">입력은 기자 발췌뿐</text>

  <!-- 배포 -->
  <rect x="30" y="440" width="170" height="90" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="115" y="468" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">GitHub Actions</text>
  <text x="115" y="490" text-anchor="middle" font-size="12" fill="#475569">검사(lint·빌드) 자동</text>
  <text x="115" y="506" text-anchor="middle" font-size="12" fill="#475569">배포는 수동 승인 실행</text>

  <!-- 화살표 -->
  <g stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#b)">
    <line x1="200" y1="230" x2="306" y2="200"/>
    <line x1="400" y1="240" x2="400" y2="296"/>
    <line x1="490" y1="345" x2="526" y2="345"/>
    <line x1="530" y1="185" x2="494" y2="185"/>
    <line x1="440" y1="450" x2="420" y2="414"/>
    <path d="M 490 320 C 600 250 700 230 766 200"/>
    <path d="M 490 380 C 580 430 700 420 766 360"/>
    <line x1="200" y1="480" x2="330" y2="540"/>
  </g>
  <g font-size="11.5" fill="#64748b">
    <text x="212" y="200">HTTPS</text>
    <text x="410" y="272">/api 프록시</text>
    <text x="600" y="238">통과 조회</text>
    <text x="585" y="440">초안 생성</text>
    <text x="345" y="440">지표 수집</text>
    <text x="215" y="530">배포</text>
  </g>
</svg>
