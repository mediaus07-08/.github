<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="30" y="40" font-size="18" font-weight="700" fill="#1a1a2e">서비스 구성 — AWS EC2 단일 호스트, Docker Compose</text>

  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <g id="i-monitor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="13" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
    </g>
    <g id="i-shield" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2 L20 5.5 V11 C20 16.5 16.5 20 12 22 C7.5 20 4 16.5 4 11 V5.5 Z"/><path d="M8.5 11.5 L11 14 L15.5 9.5"/>
    </g>
    <g id="i-lock" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10 V7 a4 4 0 0 1 8 0 V10"/>
    </g>
    <g id="i-bolt" stroke="none">
      <path d="M13 2 L5 13 H11 L9.5 22 L19 9.5 H12.5 Z"/>
    </g>
    <g id="i-db" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5 V19 C4 20.7 7.6 22 12 22 C16.4 22 20 20.7 20 19 V5"/><path d="M4 12 C4 13.7 7.6 15 12 15 C16.4 15 20 13.7 20 12"/>
    </g>
    <g id="i-chart" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3 V21 H21"/><path d="M7 15 L11 10 L14 13 L19 6"/>
    </g>
    <g id="i-search" fill="none" stroke-width="1.8" stroke-linecap="round">
      <circle cx="10" cy="10" r="6"/><line x1="14.5" y1="14.5" x2="21" y2="21"/>
    </g>
    <g id="i-spark" stroke="none">
      <path d="M12 2 L14.5 9.5 L22 12 L14.5 14.5 L12 22 L9.5 14.5 L2 12 L9.5 9.5 Z"/>
    </g>
    <g id="i-play" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M10 8.5 L16 12 L10 15.5 Z"/>
    </g>
  </defs>

  <!-- 기자 브라우저 -->
  <rect x="30" y="180" width="180" height="96" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <use href="#i-monitor" x="108" y="192" stroke="#2563eb"/>
  <text x="120" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">기자 브라우저</text>
  <text x="120" y="260" text-anchor="middle" font-size="12" fill="#475569">React SPA</text>

  <!-- EC2 외곽 -->
  <rect x="280" y="80" width="430" height="410" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="300" y="110" font-size="14" font-weight="700" fill="#334155">AWS EC2 · Docker Compose</text>

  <!-- nginx -->
  <rect x="310" y="130" width="180" height="96" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <use href="#i-shield" x="388" y="142" stroke="#059669"/>
  <text x="400" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">nginx :80/443</text>
  <text x="400" y="210" text-anchor="middle" font-size="12" fill="#475569">정적 서빙 · 프록시 · TLS</text>

  <!-- certbot -->
  <rect x="530" y="130" width="150" height="96" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <use href="#i-lock" x="593" y="142" stroke="#64748b"/>
  <text x="605" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">certbot</text>
  <text x="605" y="210" text-anchor="middle" font-size="12" fill="#475569">인증서 자동 갱신</text>

  <!-- api -->
  <rect x="310" y="270" width="180" height="96" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <use href="#i-bolt" x="388" y="282" fill="#059669"/>
  <text x="400" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">api · FastAPI</text>
  <text x="400" y="350" text-anchor="middle" font-size="12" fill="#475569">도메인 API + 비평 생성</text>

  <!-- db -->
  <rect x="530" y="270" width="150" height="96" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <use href="#i-db" x="593" y="282" stroke="#059669"/>
  <text x="605" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">PostgreSQL 15</text>
  <text x="605" y="350" text-anchor="middle" font-size="12" fill="#475569">Alembic</text>

  <!-- monitoring -->
  <rect x="310" y="405" width="370" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <use href="#i-chart" x="336" y="421" stroke="#64748b"/>
  <text x="380" y="438" font-size="13" font-weight="700" fill="#1a1a2e">Prometheus · Grafana</text>
  <text x="545" y="438" font-size="12" fill="#475569">— SSH 터널 전용</text>

  <!-- 외부 API -->
  <rect x="760" y="130" width="190" height="96" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <use href="#i-search" x="843" y="142" stroke="#ea580c"/>
  <text x="855" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">네이버 검색 API</text>
  <text x="855" y="210" text-anchor="middle" font-size="12" fill="#475569">통과 조회 · 저장 없음</text>

  <rect x="760" y="290" width="190" height="96" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <use href="#i-spark" x="843" y="302" fill="#ea580c"/>
  <text x="855" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">DeepSeek API</text>
  <text x="855" y="370" text-anchor="middle" font-size="12" fill="#475569">입력은 기자 발췌뿐</text>

  <!-- 배포 -->
  <rect x="30" y="380" width="180" height="96" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <use href="#i-play" x="108" y="392" stroke="#64748b"/>
  <text x="120" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">GitHub Actions</text>
  <text x="120" y="460" text-anchor="middle" font-size="12" fill="#475569">수동 승인 배포</text>

  <!-- 화살표 -->
  <g stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#b)">
    <line x1="210" y1="220" x2="306" y2="195"/>
    <line x1="400" y1="226" x2="400" y2="266"/>
    <line x1="490" y1="318" x2="526" y2="318"/>
    <line x1="530" y1="178" x2="494" y2="178"/>
    <line x1="430" y1="405" x2="410" y2="370"/>
    <path d="M 490 292 C 600 240 680 195 756 178"/>
    <path d="M 490 350 C 590 400 680 385 756 345"/>
    <line x1="210" y1="425" x2="276" y2="432"/>
  </g>
  <g font-size="11.5" fill="#64748b">
    <text x="218" y="198">HTTPS</text>
    <text x="410" y="252">/api</text>
    <text x="688" y="166">통과 조회</text>
    <text x="588" y="398">초안 생성</text>
    <text x="222" y="452">배포</text>
    <text x="345" y="390">지표 수집</text>
  </g>
</svg>
