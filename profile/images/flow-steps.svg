<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="980" height="300" fill="#ffffff"/>
  <text x="30" y="36" font-size="17" font-weight="700" fill="#1a1a2e">기사 작성 흐름</text>

  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <g id="p-news" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4 H17 V18 a2 2 0 0 0 2 2 H6 a2 2 0 0 1 -2 -2 Z"/><path d="M17 8 H20 V18 a2 2 0 0 1 -2 2"/>
      <line x1="7" y1="8" x2="14" y2="8"/><line x1="7" y1="12" x2="14" y2="12"/><line x1="7" y1="16" x2="11" y2="16"/>
    </g>
    <g id="p-cut" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="6" cy="6" r="2.8"/><circle cx="6" cy="18" r="2.8"/>
      <line x1="20" y1="4" x2="8.2" y2="15.8"/><line x1="14.5" y1="14.5" x2="20" y2="20"/><line x1="8.2" y1="8.2" x2="12" y2="12"/>
    </g>
    <g id="p-folder" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7 a2 2 0 0 1 2 -2 h4 l2 2 h6 a2 2 0 0 1 2 2 v8 a2 2 0 0 1 -2 2 H6 a2 2 0 0 1 -2 -2 Z"/>
      <line x1="12" y1="10.5" x2="12" y2="15.5"/><line x1="9.5" y1="13" x2="14.5" y2="13"/>
    </g>
    <g id="p-compass" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 L13.8 13.8 L8.5 15.5 L10.2 10.2 Z"/>
    </g>
    <g id="p-pen" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16.5 3.5 L20.5 7.5 L8 20 H4 V16 Z"/><line x1="14" y1="6" x2="18" y2="10"/>
    </g>
    <g id="p-check" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M8.5 13 L11 15.5 L15.5 9.5"/>
    </g>
    <g id="p-send" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 2 L11 13"/><path d="M22 2 L15 22 L11 13 L2 9 Z"/>
    </g>
  </defs>

  <!-- 구간 띠 -->
  <g font-size="12" font-weight="700">
    <rect x="55" y="84" width="330" height="5" rx="2.5" fill="#bfdbfe"/>
    <text x="220" y="76" text-anchor="middle" fill="#2563eb">기자</text>
    <rect x="445" y="84" width="200" height="5" rx="2.5" fill="#a7f3d0"/>
    <text x="545" y="76" text-anchor="middle" fill="#059669">AI</text>
    <rect x="705" y="84" width="200" height="5" rx="2.5" fill="#ddd6fe"/>
    <text x="805" y="76" text-anchor="middle" fill="#7c3aed">검토·발행</text>
  </g>

  <!-- 연결선 -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#d)">
    <line x1="124" y1="150" x2="182" y2="150"/>
    <line x1="254" y1="150" x2="312" y2="150"/>
    <line x1="384" y1="150" x2="442" y2="150"/>
    <line x1="514" y1="150" x2="572" y2="150"/>
    <line x1="644" y1="150" x2="702" y2="150"/>
    <line x1="774" y1="150" x2="832" y2="150"/>
  </g>

  <!-- 배지 7개 -->
  <g>
    <circle cx="90" cy="150" r="32" fill="#2563eb"/><use href="#p-news" transform="translate(76,136) scale(1.17)"/>
    <circle cx="220" cy="150" r="32" fill="#2563eb"/><use href="#p-cut" transform="translate(206,136) scale(1.17)"/>
    <circle cx="350" cy="150" r="32" fill="#2563eb"/><use href="#p-folder" transform="translate(336,136) scale(1.17)"/>
    <circle cx="480" cy="150" r="32" fill="#059669"/><use href="#p-compass" transform="translate(466,136) scale(1.17)"/>
    <circle cx="610" cy="150" r="32" fill="#059669"/><use href="#p-pen" transform="translate(596,136) scale(1.17)"/>
    <circle cx="740" cy="150" r="32" fill="#7c3aed"/><use href="#p-check" transform="translate(726,136) scale(1.17)"/>
    <circle cx="870" cy="150" r="32" fill="#7c3aed"/><use href="#p-send" transform="translate(856,136) scale(1.17)"/>
  </g>

  <!-- 이름 · 한 줄 -->
  <g text-anchor="middle">
    <g font-size="14" font-weight="700" fill="#1a1a2e">
      <text x="90" y="207">사설 확인</text>
      <text x="220" y="207">발췌 담기</text>
      <text x="350" y="207">이슈 묶기</text>
      <text x="480" y="207">프레이밍</text>
      <text x="610" y="207">초안 작성</text>
      <text x="740" y="207">검토</text>
      <text x="870" y="207">발행</text>
    </g>
    <g font-size="11.5" fill="#64748b">
      <text x="90" y="226">통과 조회</text>
      <text x="220" y="226">원문 직접 읽기</text>
      <text x="350" y="226">매체 3~5곳</text>
      <text x="480" y="226">대립 구도 정리</text>
      <text x="610" y="226">발췌만 근거</text>
      <text x="740" y="226">인용 원문 대조</text>
      <text x="870" y="226">데스크 승인</text>
    </g>
  </g>

  <!-- 관문 칩 -->
  <g font-size="10.5" font-weight="700" text-anchor="middle">
    <rect x="176" y="237" width="88" height="19" rx="9.5" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="220" y="250" fill="#92400e">1건 1,000자</text>
    <rect x="303" y="237" width="94" height="19" rx="9.5" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="350" y="250" fill="#92400e">매체당 1,200자</text>
  </g>

  <text x="490" y="285" text-anchor="middle" font-size="11.5" fill="#94a3b8">자동으로 저장되는 타사 데이터 0건 — 발췌가 없으면 생성은 실패한다</text>
</svg>
