<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="980" height="400" fill="#ffffff"/>
  <text x="30" y="40" font-size="18" font-weight="700" fill="#1a1a2e">기사 작성 흐름 — 근거는 기자가 고른 발췌뿐</text>

  <!-- Row 1: 기자 단계 -->
  <text x="30" y="76" font-size="13" font-weight="700" fill="#2563eb">기자</text>
  <g font-size="13" fill="#1a1a2e">
    <rect x="30" y="90" width="200" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="130" y="118" text-anchor="middle" font-weight="700">① 사설 확인</text>
    <text x="130" y="140" text-anchor="middle" font-size="12" fill="#475569">네이버 검색 API 통과 조회</text>
    <text x="130" y="156" text-anchor="middle" font-size="12" fill="#475569">결과 저장·캐시 없음</text>

    <rect x="280" y="90" width="200" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="380" y="118" text-anchor="middle" font-weight="700">② 발췌 담기</text>
    <text x="380" y="140" text-anchor="middle" font-size="12" fill="#475569">원문을 읽고 구절을 직접 입력</text>
    <text x="380" y="156" text-anchor="middle" font-size="12" fill="#b45309">관문: 1건 1,000자</text>

    <rect x="530" y="90" width="200" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="630" y="118" text-anchor="middle" font-weight="700">③ 이슈 묶기</text>
    <text x="630" y="140" text-anchor="middle" font-size="12" fill="#475569">같은 사안 발췌를 매체 3~5곳으로</text>
    <text x="630" y="156" text-anchor="middle" font-size="12" fill="#b45309">관문: 매체당 합산 1,200자</text>
  </g>

  <!-- Row 2: AI·발행 단계 -->
  <text x="30" y="226" font-size="13" font-weight="700" fill="#059669">AI 초안</text>
  <text x="530" y="226" font-size="13" font-weight="700" fill="#7c3aed">검토·발행</text>
  <g font-size="13" fill="#1a1a2e">
    <rect x="30" y="240" width="200" height="76" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="130" y="268" text-anchor="middle" font-weight="700">④ 프레이밍 (Stage A)</text>
    <text x="130" y="290" text-anchor="middle" font-size="12" fill="#475569">경위·대립 구도 정리</text>
    <text x="130" y="306" text-anchor="middle" font-size="12" fill="#475569">DeepSeek V4</text>

    <rect x="280" y="240" width="200" height="76" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="380" y="268" text-anchor="middle" font-weight="700">⑤ 초안 작성 (Stage B)</text>
    <text x="380" y="290" text-anchor="middle" font-size="12" fill="#475569">입력은 기자 발췌뿐 · 폴백 없음</text>
    <text x="380" y="306" text-anchor="middle" font-size="12" fill="#475569">인용마다 [N] 근거 번호</text>

    <rect x="530" y="240" width="200" height="76" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="630" y="268" text-anchor="middle" font-weight="700">⑥ 검토 (Stage C)</text>
    <text x="630" y="290" text-anchor="middle" font-size="12" fill="#475569">코드 검사: 인용 원문 대조</text>
    <text x="630" y="306" text-anchor="middle" font-size="12" fill="#475569">인용 총량(본문 대비) 검사</text>

    <rect x="780" y="240" width="170" height="76" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="865" y="268" text-anchor="middle" font-weight="700">⑦ 발행</text>
    <text x="865" y="290" text-anchor="middle" font-size="12" fill="#475569">데스크 확인 후 발행</text>
    <text x="865" y="306" text-anchor="middle" font-size="12" fill="#475569">발행 순간 서버가 재검사</text>
  </g>

  <!-- 화살표 -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <g stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="230" y1="128" x2="276" y2="128"/>
    <line x1="480" y1="128" x2="526" y2="128"/>
    <path d="M 630 170 C 630 212 130 192 130 236"/>
    <line x1="230" y1="278" x2="276" y2="278"/>
    <line x1="480" y1="278" x2="526" y2="278"/>
    <line x1="730" y1="278" x2="776" y2="278"/>
  </g>

  <rect x="30" y="348" width="920" height="34" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="490" y="370" text-anchor="middle" font-size="13" fill="#78350f">시스템이 자동으로 접근·저장하는 타사 데이터 0건 — 발췌가 없으면 생성은 실패한다 (의도된 설계)</text>
</svg>
