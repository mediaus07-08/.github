<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="980" height="500" fill="#ffffff"/>
  <text x="30" y="40" font-size="18" font-weight="700" fill="#1a1a2e">품질 개선 순환 — 느낌이 아니라 수치로</text>

  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <g id="i-news" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4 H17 V18 a2 2 0 0 0 2 2 H6 a2 2 0 0 1 -2 -2 Z"/><path d="M17 8 H20 V18 a2 2 0 0 1 -2 2"/>
      <line x1="7" y1="8" x2="14" y2="8"/><line x1="7" y1="12" x2="14" y2="12"/><line x1="7" y1="16" x2="11" y2="16"/>
    </g>
    <g id="i-funnel" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 4 H21 L14.5 12 V19.5 L9.5 17 V12 Z"/>
    </g>
    <g id="i-pen" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16.5 3.5 L20.5 7.5 L8 20 H4 V16 Z"/><line x1="14" y1="6" x2="18" y2="10"/>
    </g>
    <g id="i-judge" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M8.5 13 L11 15.5 L15.5 9.5"/>
    </g>
    <g id="i-loop" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 12 A8 8 0 1 1 17.5 6"/><path d="M17.5 2 V6.2 H21.7"/>
    </g>
  </defs>

  <!-- ① 실기사 수집 -->
  <rect x="40" y="80" width="250" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <use href="#i-news" x="153" y="92" stroke="#2563eb"/>
  <text x="165" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">① 실제 기사 수집</text>
  <text x="165" y="163" text-anchor="middle" font-size="12" fill="#475569">미디어스 기사 75편 코퍼스</text>
  <text x="165" y="180" text-anchor="middle" font-size="12" fill="#475569">규칙용 36편 · 시험용 분리</text>

  <!-- ② 규칙 증류 -->
  <rect x="365" y="80" width="250" height="120" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <use href="#i-funnel" x="478" y="92" stroke="#059669"/>
  <text x="490" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">② 문체 규칙 만들기</text>
  <text x="490" y="163" text-anchor="middle" font-size="12" fill="#475569">실기사에서 규칙 카드 추출</text>
  <text x="490" y="180" text-anchor="middle" font-size="12" fill="#475569">생성 프롬프트에 상시 주입</text>

  <!-- ③ 초안 생성 -->
  <rect x="690" y="80" width="250" height="120" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <use href="#i-pen" x="803" y="92" stroke="#059669"/>
  <text x="815" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">③ 초안 생성</text>
  <text x="815" y="163" text-anchor="middle" font-size="12" fill="#475569">실기사와 같은 재료(골든 셋)로</text>
  <text x="815" y="180" text-anchor="middle" font-size="12" fill="#475569">실제 생성 경로를 끝까지 실행</text>

  <!-- ④ 채점 -->
  <rect x="690" y="290" width="250" height="120" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <use href="#i-judge" x="803" y="302" stroke="#7c3aed"/>
  <text x="815" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">④ 채점</text>
  <text x="815" y="373" text-anchor="middle" font-size="12" fill="#475569">가려놓고 판별: 기자 글인가 AI인가</text>
  <text x="815" y="390" text-anchor="middle" font-size="12" fill="#475569">3표 다수결 · 정량 부합 · 6축 진단</text>

  <!-- ⑤ 규칙 개선 -->
  <rect x="365" y="290" width="250" height="120" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <use href="#i-loop" x="478" y="302" stroke="#d97706"/>
  <text x="490" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">⑤ 규칙 개선</text>
  <text x="490" y="373" text-anchor="middle" font-size="12" fill="#475569">적발 사유를 규칙·프롬프트에 반영</text>
  <text x="490" y="390" text-anchor="middle" font-size="12" fill="#475569">같은 기준으로 다시 측정(회귀)</text>

  <!-- 화살표 -->
  <g stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#c)">
    <line x1="290" y1="140" x2="361" y2="140"/>
    <line x1="615" y1="140" x2="686" y2="140"/>
    <line x1="815" y1="200" x2="815" y2="286"/>
    <line x1="690" y1="350" x2="619" y2="350"/>
    <line x1="490" y1="290" x2="490" y2="204"/>
    <path d="M 165 200 C 165 425 450 430 686 398"/>
  </g>
  <g font-size="11.5" fill="#64748b">
    <text x="500" y="250">규칙 갱신</text>
    <text x="120" y="300">실기사는 대조군으로</text>
    <text x="140" y="316">함께 채점</text>
  </g>

  <!-- 성과 -->
  <rect x="40" y="440" width="900" height="40" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="490" y="465" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">성과 — 판별 통과율 0% (첫 측정) → 100% (9표 만장일치) · 프롬프트를 바꿀 때마다 같은 기준으로 재측정</text>
</svg>
